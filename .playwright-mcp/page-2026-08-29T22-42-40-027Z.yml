            - region "What marketing assets are included with Photos 4 Real Estate packages?":
              - generic: When property information is provided, photo packages include 9 social media reels, 2 slideshows, 3 property flyers, and 6 property webpages, giving agents ready-to-use assets for social media, print, email, and online promotion.
          - generic [ref=e1493]:
            - button "Does Photos 4 Real Estate offer free marketing tools for realtors?" [ref=e1494] [cursor=pointer]
            - region "Does Photos 4 Real Estate offer free marketing tools for realtors?":
              - generic: Yes. Photos 4 Real Estate offers free tools including a reel generator, slideshow generator, property flyer generator, and QR code generator so realtors can create marketing materials quickly without extra design software.
