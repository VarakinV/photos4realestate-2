            - region "What makes Photos 4 Real Estate different from other Calgary real estate photography companies?" [ref=e1473]:
              - generic [ref=e1474]: Photos 4 Real Estate includes professional photos, iGUIDE 3D tours, RMS measurements, floor plans, blue sky replacement, next-day delivery, marketing assets, free tools, and a points rewards program. Most providers offer some of these services, but not the same all-in-one value package.
          - generic [ref=e1475]:
