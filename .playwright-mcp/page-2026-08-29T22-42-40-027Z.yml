            - region "Are the comparison points based on public information?":
              - generic: Yes. The comparison is based on publicly available service information and general package positioning as of 2026. Service offerings can change, so realtors should always confirm current package details with each provider.
          - generic [ref=e1481]:
            - button "Do all Photos 4 Real Estate packages include iGUIDE and RMS measurements?" [ref=e1482] [cursor=pointer]
            - region "Do all Photos 4 Real Estate packages include iGUIDE and RMS measurements?":
              - generic: Our real estate photography packages are designed around professional photography, iGUIDE 3D virtual tours, RMS measurements, and standard floor plans so Calgary agents can market listings with accurate property data and stronger online presentation.
          - generic [ref=e1487]:
