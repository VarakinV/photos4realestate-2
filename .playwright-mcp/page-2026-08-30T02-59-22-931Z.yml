      - generic [ref=f15e50]:
        - generic [ref=f15e51]:
          - text: Why Preparation Matters
          - heading "Why Should You Prepare Before a Real Estate Photoshoot?" [level=2] [ref=f15e52]
          - paragraph [ref=f15e53]: A prepared property photographs better, feels more spacious, and helps buyers focus on the home instead of distractions.
          - paragraph [ref=f15e54]: Professional photography can make a listing stand out, but the property still needs to be clean, accessible, and photo-ready before the appointment. Small details like clear counters, working lights, tidy bedding, and moved vehicles can make a significant difference in the final images.
          - paragraph [ref=f15e55]: Use this checklist before photography, video, drone, RMS measurements, iGUIDE virtual tours, and marketing-kit creation. The same preparation helps all listing media look more polished and consistent.
        - generic [ref=f15e56]:
          - heading "Download the printable checklist" [level=3] [ref=f15e61]
          - paragraph [ref=f15e62]: Keep the PDF handy and share it with sellers, tenants, cleaners, or anyone helping prepare the property before photo day.
          - link "Download Photoshoot Checklist PDF for real estate photo preparation" [ref=f15e63] [cursor=pointer]:
            - /url: https://cdn.photos4realestate.ca/p4re-static-media/photoshoot-checklist-page/Photoshoot%20Checklist%20-%202.pdf
