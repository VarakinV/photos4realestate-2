        - generic [ref=f15e376]:
          - generic [ref=f15e377]:
            - button "How clean should a property be before real estate photos?" [expanded] [ref=f15e378] [cursor=pointer]
            - region "How clean should a property be before real estate photos?" [ref=f15e383]:
              - generic [ref=f15e384]: The property should be as clean and decluttered as possible before the photographer arrives. Clear countertops, remove personal items, clean floors and windows, and make sure the home looks ready for buyers to view online.
          - generic [ref=f15e385]:
            - button "Should lights be on or off for a real estate photoshoot?" [ref=f15e386] [cursor=pointer]
            - region "Should lights be on or off for a real estate photoshoot?":
              - generic: Make sure all lights are working and replace burnt-out bulbs before the shoot. The photographer may decide which lights to use based on the room, natural light, and photo style, but working lights give them the best options.
          - generic [ref=f15e391]:
            - button "Should vehicles be moved before exterior photos?" [ref=f15e392] [cursor=pointer]
            - region "Should vehicles be moved before exterior photos?":
              - generic: Yes. Move vehicles out of the driveway and away from the front of the property before the appointment. This keeps the exterior photos clean and helps buyers focus on the home.
          - generic [ref=f15e397]:
            - button "What should I do with pets during the photoshoot?" [ref=f15e398] [cursor=pointer]
            - region "What should I do with pets during the photoshoot?":
              - generic: Pets should be kept safely away from the areas being photographed. Remove pet beds, bowls, toys, litter boxes, and other pet items wherever possible.
          - generic [ref=f15e403]:
            - button "When should the checklist be completed?" [ref=f15e404] [cursor=pointer]
            - region "When should the checklist be completed?":
              - generic: Ideally, complete the checklist before the photographer arrives. Real estate photography appointments are scheduled for capturing the property, not staging or cleaning, so preparation should happen ahead of time.
          - generic [ref=f15e409]:
            - button "Can Photos 4 Real Estate help if I have questions before the shoot?" [ref=f15e410] [cursor=pointer]
            - region "Can Photos 4 Real Estate help if I have questions before the shoot?":
              - generic: Yes. If you are unsure how to prepare a room or exterior area, call (825) 449-5001 or email info@photos4realestate.ca. We are happy to help you prepare for a smooth real estate photoshoot in Calgary.
