    - region [ref=f15e92]:
      - generic [ref=f15e93]:
        - generic [ref=f15e94]:
          - text: Interior Preparation
          - heading "How Should You Prepare the Interior Before a Photoshoot?" [level=2] [ref=f15e95]
          - paragraph [ref=f15e99]: Interior preparation helps rooms feel clean, bright, spacious, and easy for buyers to understand in photos.
        - generic [ref=f15e100]:
          - article [ref=f15e101]:
            - heading "Declutter and clean" [level=3] [ref=f15e108]
            - list [ref=f15e109]:
              - listitem [ref=f15e110]: Remove personal items, family photos, paperwork, fridge magnets, and excess decor.
              - listitem [ref=f15e114]: Clear countertops, tables, shelves, bathroom vanities, and nightstands.
              - listitem [ref=f15e118]: Clean floors, mirrors, windows, appliances, fixtures, and visible surfaces.
          - article [ref=f15e122]:
            - heading "Lighting" [level=3] [ref=f15e127]
            - list [ref=f15e128]:
              - listitem [ref=f15e129]: Replace burnt-out bulbs and make sure every light fixture works.
              - listitem [ref=f15e133]: Use consistent bulb colours where possible, especially in kitchens and bathrooms.
              - listitem [ref=f15e137]: Open curtains and blinds to bring in natural light before the photographer arrives.
          - article [ref=f15e141]:
            - heading "Furniture and flow" [level=3] [ref=f15e147]
            - list [ref=f15e148]:
              - listitem [ref=f15e149]: Arrange furniture to create open walking paths and a welcoming layout.
              - listitem [ref=f15e153]: Remove unnecessary chairs, side tables, storage bins, or bulky items that make rooms look smaller.
              - listitem [ref=f15e157]: Straighten rugs, dining chairs, stools, curtains, and visible cords.
          - article [ref=f15e161]:
            - heading "Beds and decor" [level=3] [ref=f15e167]
            - list [ref=f15e168]:
              - listitem [ref=f15e169]: Make beds neatly, smooth linens, and fluff pillows.
              - listitem [ref=f15e173]: Use simple, neutral decorations that enhance the room without distracting buyers.
              - listitem [ref=f15e177]: Put away laundry baskets, garbage bins, toiletries, and personal bathroom items.
    - region [ref=f15e181]:
      - generic [ref=f15e182]:
        - generic [ref=f15e183]:
          - text: Exterior Preparation
          - heading "How Should You Prepare the Exterior Before Real Estate Photos?" [level=2] [ref=f15e184]
          - paragraph [ref=f15e188]: Exterior preparation is important because the front photo is often the first image buyers see online.
        - generic [ref=f15e189]:
          - article [ref=f15e190]:
            - heading "Yard and garden" [level=3] [ref=f15e196]
            - list [ref=f15e197]:
              - listitem [ref=f15e198]: Mow the lawn, trim hedges, remove weeds, and clear branches or debris.
              - listitem [ref=f15e202]: Put away hoses, tools, toys, sports equipment, garbage bins, and seasonal clutter.
              - listitem [ref=f15e206]: Add simple planters or fresh exterior touches only if they look clean and intentional.
          - article [ref=f15e210]:
            - heading "Driveway and walkways" [level=3] [ref=f15e216]
            - list [ref=f15e217]:
              - listitem [ref=f15e218]: Sweep driveways, walkways, patios, decks, porches, and garage entrances.
              - listitem [ref=f15e222]: Move vehicles away from the driveway and front of the property before the shoot.
              - listitem [ref=f15e226]: Keep access clear for exterior, backyard, garage, and community-feature photos.
          - article [ref=f15e230]:
            - heading "Exterior fixtures" [level=3] [ref=f15e236]
            - list [ref=f15e237]:
              - listitem [ref=f15e238]: Check exterior lights and replace burnt-out bulbs.
              - listitem [ref=f15e242]: Clean visible windows, glass doors, outdoor furniture, and entry areas.
              - listitem [ref=f15e246]: Close garage doors, tidy patio furniture, and remove BBQ covers if appropriate.
          - article [ref=f15e250]:
            - heading "Seasonal details" [level=3] [ref=f15e266]
            - list [ref=f15e267]:
              - listitem [ref=f15e268]: In winter, shovel pathways, steps, driveways, decks, and patios; clear ice where possible.
              - listitem [ref=f15e272]: In summer, water the lawn and garden early enough to avoid puddles during the shoot.
              - listitem [ref=f15e276]: Remove seasonal decorations if they make the listing feel dated or distract from the property.
    - region [ref=f15e280]:
      - generic [ref=f15e281]:
        - generic [ref=f15e282]:
          - text: Final Touches
          - heading "What Should You Do Right Before the Photographer Arrives?" [level=2] [ref=f15e283]
          - paragraph [ref=f15e287]: A final walkthrough prevents small distractions from appearing in MLS photos, floor plans, tours, and marketing materials.
        - generic [ref=f15e288]:
          - article [ref=f15e289]:
            - heading "Pets" [level=3] [ref=f15e297]
            - list [ref=f15e298]:
              - listitem [ref=f15e299]: Keep pets safely away from the photographed areas during the shoot.
              - listitem [ref=f15e303]: Remove pet beds, bowls, litter boxes, toys, leashes, and scratching posts where possible.
              - listitem [ref=f15e307]: Plan ahead if pets need to leave the property during photography, video, or iGUIDE scanning.
          - article [ref=f15e311]:
            - heading "Final sweep" [level=3] [ref=f15e317]
            - list [ref=f15e318]:
              - listitem [ref=f15e319]: Do one last walkthrough of every room before the appointment starts.
              - listitem [ref=f15e323]: Turn on lights, open interior doors, and make sure important spaces are accessible.
              - listitem [ref=f15e327]: Hide remotes, chargers, cleaning supplies, keys, shoes, jackets, and personal documents.
          - article [ref=f15e331]:
            - heading "Shoot readiness" [level=3] [ref=f15e340]
            - list [ref=f15e341]:
              - listitem [ref=f15e342]: Have the home photo-ready before the scheduled start time.
              - listitem [ref=f15e346]: Let the photographer know about special features, views, renovations, or areas to avoid.
              - listitem [ref=f15e350]: If the property is occupied, reduce movement through rooms while photos are being taken.
